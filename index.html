<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Fly a rocket-powered Cybertruck-style roadster. Dodge barriers, drones and meteors in this free browser game for phones and desktops.">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
<title>Cyber Rocket Roadster</title>
<style>
:root{--bg:#070a14;--fg:#e8eef9;--mut:#8fa0c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#070a14;--fg:#e8eef9}}
:root[data-theme="dark"]{--bg:#070a14;--fg:#e8eef9}
html,body{height:100%;height:100dvh;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column}
#top{flex:none;display:flex;flex-direction:column;align-items:center}
#meta{align-self:flex-end;padding:2px 10px;font-size:11px}
#meta a{color:var(--mut);text-decoration:none}
#adbar{width:100%;max-width:728px;overflow:hidden}
#adbar ins{display:block;width:100%;height:60px}
#adbar ins[data-ad-status="unfilled"]{display:none}
#stage{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<div id="top">
<div id="meta"><a href="/privacy">Privacy</a></div>
<div id="adbar"><ins class="adsbygoogle" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="0000000000" data-ad-format="horizontal" data-full-width-responsive="false"></ins></div>
</div>
<div id="stage"><canvas id="g"></canvas></div>
<script>
const c=document.getElementById('g'),x=c.getContext('2d',{alpha:false});
const LOW=matchMedia('(pointer:coarse)').matches,MAXP=LOW?110:260,STAGE=document.getElementById('stage'),ADBAR=document.getElementById('adbar');
if(document.querySelector('script[src*="adsbygoogle"]').src.includes('XXXX'))ADBAR.style.display='none';
else try{(window.adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}
let W,H,G,sc=1;
function rs(){
  const cw=c.clientWidth,ch=c.clientHeight;if(!cw||!ch)return;
  let dpr=Math.min(devicePixelRatio||1,2);
  if(cw*ch*dpr*dpr>2.2e6)dpr=Math.max(1,Math.sqrt(2.2e6/(cw*ch)));
  sc=Math.max(Math.min(ch/520,cw/760),ch/820);
  W=cw/sc;H=ch/sc;G=H*.82;
  const pw=Math.round(cw*dpr),ph=Math.round(ch*dpr);
  if(c.width!==pw||c.height!==ph){c.width=pw;c.height=ph}
  x.setTransform(pw/W,0,0,ph/H,0,0);
  if(car&&car.y>G-1)car.y=G;
}
let st='menu',best=0,held=false,t=0,dist=0,score=0,bonus=0,speed=320,over=0;
let car={x:150,y:0,vy:0,fuel:100,gr:true},obs=[],pk=[],parts=[],gapT=500,pkT=300;
try{best=+localStorage.getItem('crbest')||0}catch(e){}
const stars=Array.from({length:LOW?50:90},()=>({x:Math.random()*2000,y:Math.random(),r:Math.random()*1.4+.3}));
rs();new ResizeObserver(rs).observe(STAGE);addEventListener('orientationchange',()=>setTimeout(rs,250));car.y=G;

function reset(){
  car={x:Math.max(110,W*.14),y:G,vy:0,fuel:100,gr:true};
  obs=[];pk=[];parts=[];gapT=600;pkT=400;dist=0;score=0;bonus=0;speed=320;st='play';
}
function press(v){
  held=v;
  if(v){
    if(st==='menu')reset();
    else if(st==='over'&&performance.now()-over>600)reset();
  }
}
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)press(true)}
});
addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code))held=false});
STAGE.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('blur',()=>{held=false});
document.addEventListener('visibilitychange',()=>{held=false;last=0});
c.addEventListener('pointerdown',e=>{e.preventDefault();press(true)});
addEventListener('pointerup',()=>{held=false});
addEventListener('pointercancel',()=>{held=false});

const R=(a,b)=>a+Math.random()*(b-a);
function burst(px,py,n,cols,sp){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=R(.2,1)*sp;
    parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:R(.4,.9),m:.9,c:cols[i%cols.length],r:R(2,5)})}
}
function spawnObs(){
  const r=Math.random(),sx=W+60;
  if(r<.5){const w=R(30,52),h=R(42,84);obs.push({k:'b',x:sx,y:G,w,h})}
  else if(r<.82){const by=R(110,G-90);obs.push({k:'d',x:sx,y:by,by,ph:R(0,6),w:34,h:26})}
  else{obs.push({k:'m',x:R(W*.5,W)+100,y:-30,vx:170,vy:240,w:30,h:30})}
}
function spawnPk(){
  const y=R(100,G-60),n=Math.random()<.22?1:5;
  if(n===1)pk.push({k:'f',x:W+40,y});
  else for(let i=0;i<n;i++)pk.push({k:'c',x:W+40+i*44,y:y-Math.sin(i/(n-1)*Math.PI)*50});
}
function updParts(dt){
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}
  parts=parts.filter(p=>p.l>0);if(parts.length>MAXP)parts.splice(0,parts.length-MAXP);
}
function update(dt){
  t+=dt;updParts(dt);
  if(st!=='play'){dist+=130*dt;return}
  speed=(320+Math.min(320,score*.12))*Math.min(1,.3+W/760);
  dist+=speed*dt;
  score=Math.floor(dist/10)+bonus;
  const th=held&&car.fuel>0;
  car.vy+=(900-(th?2000:0))*dt;
  car.vy=Math.max(-400,Math.min(560,car.vy));
  car.y+=car.vy*dt;
  if(th)car.fuel=Math.max(0,car.fuel-24*dt);
  if(car.y<=70){car.y=70;car.vy=Math.max(0,car.vy)}
  car.gr=false;
  if(car.y>=G){
    if(car.vy>350)burst(car.x,G,8,['#9aa6b5','#5c6675'],120);
    car.y=G;car.vy=0;car.gr=true;car.fuel=Math.min(100,car.fuel+16*dt);
  }
  if(th){
    for(let i=0;i<3;i++){
      parts.push({x:car.x-48,y:car.y-24,vx:R(-380,-220),vy:R(-30,30),l:R(.2,.4),m:.4,c:i?'#ffb300':'#ff5722',r:R(3,7)});
    }
    parts.push({x:car.x-8+R(-6,6),y:car.y-8,vx:R(-80,0),vy:R(260,420),l:R(.15,.3),m:.3,c:'#00e5ff',r:R(2,5)});
  }
  if(car.gr&&Math.random()<.5)parts.push({x:car.x-30,y:G,vx:R(-200,-100),vy:R(-60,-10),l:.35,m:.35,c:'#6b7482',r:R(1,3)});
  gapT-=speed*dt;if(gapT<=0){spawnObs();gapT=R(360,680)*(1-Math.min(.4,score/3000))}
  pkT-=speed*dt;if(pkT<=0){spawnPk();pkT=R(500,900)}
  for(const o of obs){
    o.x-=(speed+(o.vx||0))*dt;
    if(o.k==='d')o.y=o.by+Math.sin(t*3+o.ph)*34;
    if(o.k==='m'){o.y+=o.vy*dt;o.x+=0}
  }
  obs=obs.filter(o=>o.x>-120&&o.y<G+60);
  for(const p of pk)p.x-=speed*dt;
  const cb={l:car.x-38,r:car.x+38,t:car.y-38,b:car.y-2};
  for(const p of pk){
    if(Math.hypot(p.x-car.x,p.y-(car.y-20))<34){
      p.dead=1;
      if(p.k==='c'){bonus+=10;burst(p.x,p.y,6,['#ffd600','#fff59d'],160)}
      else{car.fuel=Math.min(100,car.fuel+35);burst(p.x,p.y,10,['#69f0ae','#b9f6ca'],200)}
    }
  }
  pk=pk.filter(p=>!p.dead&&p.x>-60);
  for(const o of obs){
    let bx,by,bw,bh;
    if(o.k==='b'){bx=o.x;by=o.y-o.h;bw=o.w;bh=o.h}
    else{bx=o.x-o.w/2+4;by=o.y-o.h/2+4;bw=o.w-8;bh=o.h-8}
    if(cb.r>bx&&cb.l<bx+bw&&cb.b>by&&cb.t<by+bh){crash();break}
  }
}
function crash(){
  st='over';over=performance.now();held=false;try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
  burst(car.x,car.y-20,60,['#ff5722','#ffb300','#fff','#b0bec5'],420);
  if(score>best){best=score;try{localStorage.setItem('crbest',best)}catch(e){}}
}

/* ---------- drawing ---------- */
function mount(sp,hgt,col,base){
  x.fillStyle=col;x.beginPath();x.moveTo(0,G);
  for(let i=0;i<=W+12;i+=12){const u=i+dist*sp;
    x.lineTo(i,G-base-Math.abs(Math.sin(u*.004))*hgt-Math.sin(u*.013)*hgt*.25)}
  x.lineTo(W+12,G);x.closePath();x.fill();
}
function drawBG(){
  const g=x.createLinearGradient(0,0,0,G);
  g.addColorStop(0,'#04060f');g.addColorStop(.6,'#101a3a');g.addColorStop(1,'#2a1f4a');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='#fff';
  for(const s of stars){
    const px=((s.x-dist*.02*s.r)%W+W)%W;
    x.globalAlpha=.4+.5*Math.abs(Math.sin(t*s.r+s.x));
    x.fillRect(px,s.y*G*.75,s.r,s.r);
  }
  x.globalAlpha=1;
  x.fillStyle='#dfe8ff';x.beginPath();x.arc(W*.78,H*.16,26,0,7);x.fill();
  x.fillStyle='#101a3a';x.beginPath();x.arc(W*.78+9,H*.16-4,22,0,7);x.fill();
  mount(.08,110,'#1a2150',70);
  mount(.2,70,'#141a3d',30);
  x.fillStyle='#0c1020';x.fillRect(0,G,W,H-G);
  x.fillStyle='#1b2236';x.fillRect(0,G,W,3);
  x.fillStyle='#4a5670';
  const off=-(dist%80);
  for(let i=off;i<W;i+=80)x.fillRect(i,G+((H-G)*.45),40,4);
}
function drawTruck(){
  x.save();x.translate(car.x,car.y);
  const tilt=car.gr?0:Math.max(-.3,Math.min(.3,car.vy/1400));
  x.translate(0,-20);x.rotate(tilt);x.translate(0,20);
  if(held&&car.fuel>0&&st==='play'){
    x.globalCompositeOperation='lighter';
    const fl=R(40,70);
    const gr=x.createLinearGradient(-50,0,-50-fl,0);
    gr.addColorStop(0,'#fff3c4');gr.addColorStop(.4,'#ff9800');gr.addColorStop(1,'rgba(255,60,0,0)');
    x.fillStyle=gr;x.beginPath();x.moveTo(-50,-30);x.lineTo(-50-fl,-24);x.lineTo(-50,-18);x.fill();
    x.globalCompositeOperation='source-over';
  }
  const g=x.createLinearGradient(0,-44,0,-8);
  g.addColorStop(0,'#e3e8ee');g.addColorStop(.5,'#a7b0bc');g.addColorStop(1,'#59626f');
  x.fillStyle=g;x.strokeStyle='#2a303a';x.lineWidth=1.5;x.lineJoin='round';
  x.beginPath();x.moveTo(-46,-10);x.lineTo(-46,-34);x.lineTo(-8,-43);x.lineTo(47,-21);x.lineTo(47,-10);x.closePath();
  x.fill();x.stroke();
  x.fillStyle='#10223a';
  x.beginPath();x.moveTo(-4,-39);x.lineTo(30,-25);x.lineTo(-10,-25);x.closePath();x.fill();
  x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=1;
  x.beginPath();x.moveTo(-46,-34);x.lineTo(30,-25);x.moveTo(-10,-25);x.lineTo(-10,-10);x.stroke();
  x.fillStyle='#ff1744';x.fillRect(-46,-32,3,6);
  x.fillStyle='#00e5ff';x.shadowColor='#00e5ff';x.shadowBlur=LOW?0:10;x.fillRect(38,-24,9,3);x.shadowBlur=LOW?0:0;
  x.fillStyle='#2b313b';x.fillRect(-56,-30,12,12);
  x.fillStyle='#ff6d00';x.fillRect(-57,-27,3,6);
  x.fillStyle='#2b313b';x.fillRect(-16,-10,30,4);
  x.fillStyle='#111';
  for(const wx of[-28,28]){x.beginPath();x.arc(wx,-8,9,0,7);x.fill();
    x.fillStyle='#b5bdc8';x.beginPath();x.arc(wx,-8,4,0,7);x.fill();x.fillStyle='#111'}
  x.restore();
}
function drawObs(){
  for(const o of obs){
    if(o.k==='b'){
      x.fillStyle='#39414f';x.fillRect(o.x,o.y-o.h,o.w,o.h);
      x.fillStyle='#ffb300';
      for(let y=o.y-o.h;y<o.y-6;y+=18){x.beginPath();x.moveTo(o.x,y+12);x.lineTo(o.x+o.w,y);x.lineTo(o.x+o.w,y+8);x.lineTo(o.x,y+20);x.fill()}
      x.fillStyle='#ff3d00';x.fillRect(o.x,o.y-o.h,o.w,4);
    }else if(o.k==='d'){
      x.save();x.translate(o.x,o.y);
      x.fillStyle='#5b6573';x.beginPath();x.ellipse(0,0,18,10,0,0,7);x.fill();
      x.strokeStyle='#cfd8dc';x.lineWidth=2;
      const r=Math.sin(t*40)*14;x.beginPath();x.moveTo(-r-6,-13);x.lineTo(r+6,-13);x.stroke();
      x.fillStyle='#ff1744';x.shadowColor='#ff1744';x.shadowBlur=LOW?0:10;x.beginPath();x.arc(0,1,4,0,7);x.fill();
      x.restore();
    }else{
      x.save();x.translate(o.x,o.y);
      const gr=x.createLinearGradient(0,0,70,-90);gr.addColorStop(0,'#ff8f00');gr.addColorStop(1,'rgba(255,87,34,0)');
      x.strokeStyle=gr;x.lineWidth=14;x.lineCap='round';x.beginPath();x.moveTo(0,0);x.lineTo(70,-90);x.stroke();
      x.fillStyle='#6d4c41';x.beginPath();x.arc(0,0,15,0,7);x.fill();
      x.fillStyle='#3e2723';x.beginPath();x.arc(-4,-3,4,0,7);x.fill();
      x.restore();
    }
  }
}
function drawPk(){
  for(const p of pk){
    if(p.k==='c'){
      const w=Math.abs(Math.cos(t*4+p.x*.02))*8+2;
      x.fillStyle='#ffd600';x.beginPath();x.ellipse(p.x,p.y,w,9,0,0,7);x.fill();
    }else{
      x.shadowColor='#69f0ae';x.shadowBlur=LOW?0:14;x.fillStyle='#00c853';
      x.fillRect(p.x-9,p.y-13,18,26);x.shadowBlur=LOW?0:0;
      x.fillStyle='#fff';x.beginPath();x.moveTo(p.x+2,p.y-9);x.lineTo(p.x-5,p.y+1);x.lineTo(p.x,p.y+1);x.lineTo(p.x-2,p.y+9);x.lineTo(p.x+5,p.y-2);x.lineTo(p.x,p.y-2);x.fill();
    }
  }
}
function drawParts(){
  x.globalCompositeOperation='lighter';
  for(const p of parts){x.globalAlpha=Math.max(0,p.l/p.m);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}
  x.globalAlpha=1;x.globalCompositeOperation='source-over';
}
function txt(s,px,py,size,col,al,wt){
  x.font=(wt||700)+' '+size+'px system-ui,-apple-system,"Segoe UI",sans-serif';
  x.fillStyle=col||'#e8eef9';x.textAlign=al||'center';x.fillText(s,px,py);
}
function drawHUD(){
  txt('Score '+score,18,34,22,'#e8eef9','left');
  txt('Best '+best,18,58,14,'#8fa0c4','left',500);
  const bw=Math.min(200,W*.3),bx=W-bw-18;
  x.fillStyle='rgba(255,255,255,.12)';x.fillRect(bx,20,bw,14);
  const f=car.fuel/100;
  x.fillStyle=f<.25?'#ff5252':'#00e5ff';x.fillRect(bx,20,bw*f,14);
  txt('Rocket fuel',W-18,56,14,'#8fa0c4','right',500);
}
function draw(){
  x.clearRect(0,0,W,H);
  drawBG();drawPk();drawObs();
  if(st!=='over')drawTruck();
  drawParts();
  if(st==='play')drawHUD();
  if(st==='menu'){
    txt('Cyber Rocket Roadster',W/2,H*.3,Math.min(46,W*.07),'#e8eef9');
    txt('Hold Space, Up or tap to fire the rockets. Release to drop.',W/2,H*.3+34,Math.min(18,W*.032),'#9fb0d6',null,500);
    txt('Dodge barriers, drones and meteors. Grab fuel and coins.',W/2,H*.3+58,Math.min(16,W*.03),'#9fb0d6',null,500);
    if(H>W)txt('Tip: landscape gives you more room',W/2,H*.3+80,14,'#8fa0c4',null,500);
    txt(Math.sin(t*4)>-.3?'Press Space or tap to launch':'',W/2,H*.3+100,22,'#00e5ff');
  }
  if(st==='over'){
    x.fillStyle='rgba(4,6,15,.6)';x.fillRect(0,0,W,H);
    txt('Crashed',W/2,H*.36,48,'#ff5252');
    txt('Score '+score+(score>=best&&score>0?'  (new best)':'   Best '+best),W/2,H*.36+40,22,'#e8eef9',null,500);
    txt('Press Space or tap to try again',W/2,H*.36+84,20,'#00e5ff');
  }
}
let last=0;
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
